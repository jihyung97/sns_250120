<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/userLayout}"
      >
  <th:block layout:fragment="content">
    <section class="h-75 d-flex justify-content-center align-items-center">
      <div class="w-50 h-50  ">
        <div class="h-25 d-flex align-items-center">
          <h1>로그인</h1>
        </div>
        <div class="d-flex justify-content-center align-items-center bg-default h-85">
          <div class="w-50 h-60 ">
            <form id = "loginForm" action="/user/sign-in" method="post" class="h-100">
              <div class="d-flex justify-content-center w-100 user-input">
                <input type="text" id="loginId" name = "loginId" class="col-7">
              </div>
              <div class="d-flex justify-content-center w-100 my-2 user-input">
                <input type="text" id="password" name = "password" class="col-7">
              </div>
              <div class="d-flex justify-content-center w-100 my-4 user-input">
                <!-- 회원가입 버튼은 form 의 서브밋에 해당하지 않음-->
                <a href="/user/sign-up-view" class="w-25 h-100"><button type="button" class="form-control w-100 h-100 ">회원가입</button></a>
                <button type="submit" class="form-control ml-5 w-25 h-100">로그인</button>
              </div>
            </form>
          </div>




        </div>

      </div>


    </section>

    <script>
      $(function(){
          $("#loginForm").on("submit", function(e){
            e.preventDefault();
            let loginId = $("#loginId").val().trim();
            let password = $("#password").val().trim();

            if(!loginId){
              alert("아이디를 입력하세요");
              return false;
            }

            if(!password){
              alert("비밀번호를 입력하세요");
              return false;
            }

            let url = $(this).attr("action");
            let params = $(this).serialize();

            console.log(url);
            console.log(params);
            //ajax 통신, 노출방지 post 요청
            $.post(url, params)
            .done(function(data){
              if(data.code == 200){
                location.href = "/post/post-list-view";

              }else{
                alert(data.error_message);
              }



            });

          });

       });
    

    </script>

  </th:block>
</html>
