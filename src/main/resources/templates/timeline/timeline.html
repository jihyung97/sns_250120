<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/userLayout}"
>

<th:block layout:fragment="content">
  <!-- post 작성 section -->
  <section id ="post-section" class=" d-flex justify-content-center align-items-center">
    <div class=" post h-85 w-75 bg-post">
      <div class="w-100 h-100">
        <div class="h-75 d-flex justify-content-center" >
          <!--post 내용-->
          <input type="text" placeholder="내용을 입력해주세요." id="text-post" class="h-100 w-90  bg-post border-0">
        </div>
        <div class="h-25 d-flex justify-content-between">
          <div class="file-upload d-flex">
              <!-- file 태그를 숨겨두고 이미지를 클릭하면 파일을 클릭한 것과 같은 효과를 준다. -->
              <input type="file" id="file" accept=".jpg, .png, .gif" class="d-none">

              <!-- 이미지에 마우스 올리면 마우스 커서가 link로 변경 -->
              <a href="#" id="fileUploadBtn"><img width="35" src="https://cdn4.iconfinder.com/data/icons/ionicons/512/icon-image-512.png"></a>

              <div id="fileName" class="ml-2"></div>
          </div>
          <div>
            <button class="button form-control" id="post-save-btn">업로드</button>
          </div>

        </div>
      </div>

    </div>

  </section>
  <div class="d-flex">
  <section id = "friendList">
    <div class="d-flex">
      <input type="text" id="search-friend">
      <button class="button form-control" id="friend-search-btn">친구요청</button>


    </div>
    <div>
      <div><h3>받은 친구요청</h3></div>
      <div>
        <!--th:each로 친구요청 리스트-->
        <div th:each="friendRequest : ${FriendRequestList}" class="friendRequest">
          <span th:text="${friendRequest.name}" class="request-name"></span>
          <!--친구요청 리스트에서는 myId가 요청을 보낸 친구이므로 th데이터 friend-Id 는 friendrequestDTo의 myId이다-->
          <span class="friend-add-btn" th:data-friend-id ="${friendRequest.myId}">친구추가</span>
        </div>
      </div>
    </div>
    <div>
      <div><h3>내 친구요청</h3></div>
      <div>
        <!--th:each로 내가 보낸 친구요청 리스트-->
        <div th:each="myfriendRequest : ${myFriendRequestList}" >
          <span th:text="${myfriendRequest.name}" class="myrequest-name"></span>
          <span class="friend-cancel-btn" th:data-friend-id="${myfriendRequest.friendId}">취소</span>
        </div>
      </div>
    </div>
    <div>
      <div><h3>친구목록</h3></div>
      <!--th:each로 친구 리스트-->
        <div th:each="friendDto : ${FriendDtoList}" >
          <span th:text="${friendDto.name}" class="friendName"></span>
          <span class="friend-delete-btn" th:data-friend-id="${friendDto.friendId}">친구 삭제</span>
        </div>
   

    </div>
  </section>
  <!--card 목록-->
  <section id="cardList-section">

    <div class="card" th:each="cardDto : ${cardDtoList}" th:data-postId="${cardDto.post.id}"  >
      <div class="h-70">
        <!--더보기 -->
        <div class="bg-default w-100 d-flex justify-content-between ">
          <div><span>글쓴이</span></div>
          <a href="#" class="more-btn">
            <img src="https://www.iconninja.com/files/860/824/939/more-icon.png" width="30">
          </a>

        </div>
        <!--이미지-->
        <div class=" d-flex justify-content-center align-items-center">

          <img th:src="@{${cardDto.post.imagePath}}" class="w-50" alt="본문 이미지" />


        </div>
        <!--좋아요-->
        <div class=" d-flex justify-content-start">
          <a href="#" class="like-btn ml-2">
              <img
                  th:src="${cardDto.doILike} ? '/image/filled_heart.png' : 'https://www.iconninja.com/files/214/518/441/heart-icon.png'"
                  class="like-image"
                  width="18"
                  height="18"
                  alt="heart icon"
              >
            
          </a>
            <span>좋아요 </span> <span th:text="${cardDto.likeCount}"  class="like-count"></span> <span>개</span>

        </div>

        <div class=" d-flex card-content">
          <div><span class="text-bold col-3">글쓴이</span></div>
          <div class="w-75">
            <!-- 글 context-->
            <span class="w-85 h-90" id="text-content" th:text="${cardDto.post.content}"></span>
          </div>
        </div>
      </div>
      <div id="comment-section">
        <div class="h-10 bg-default d-flex justify-content-start">
          <span>댓글</span>
        </div>
        <!--댓글 목록들-->
        <div class="h-70" >
          <div class="d-flex comment" th:each="comment : ${cardDto.comments}" th:data-commentid="${comment.id}" >
            <div class="w-30"><span class="text-bold" th:text="${comment.userName}"></span></div>
            <div class="w-70"  th:text="${comment.content}"><span></span></div>
            <button class="button comment-delete-btn">삭제</button>
          </div>
        </div>
        <!--댓글 입력-->
        <div class="h-20">
          <div class="h-90 w-90 d-flex justify-content-between">
            <input type="text" class="form-control comment-text" placeholder="댓글 내용을 입력해주세요">


              <button class="button form-control btn-comment">게시</button>


          </div>
        </div>
      </div>


    </div>





  </section>
  </div>


  <script>
    $(function(){
     // fileUploadBtn을 눌렀을 때 id가 file인 버튼을 클릭한 것으로 동작하게 함

      $("#fileUploadBtn").on("click", function(e){
         e.preventDefault();
        $("#file").click(); 

      })
       

      

      $("#file").on("change", function(e){
        let fileName = e.target.files[0].name;
        console.log(fileName);

        let ext = fileName.split(".").pop().toLowerCase();
        console.log(ext);
        if(!(ext == "gif" || ext == "jpg" || ext == "png")){
          alert("이미지만 업로드 할 수 있습니다");
          $("#file").val("");
          $("#fileName").text("");
          return;
        }
        $("#fileName").text(fileName);
      });

   


      $("#post-save-btn").on("click",function(){
        let content = $("#text-post").val().trim();
        if(!content){
          alert("내용을 입력하세요");
          return;
        }
        let formData = new FormData();
        formData.append("content",content);
        formData.append("file",$("#file")[0].files[0]);
        $.ajax({
          type:"post"
          ,url:"/post/create"
          ,data : formData
          , processData:false
          ,contentType:false
          ,enctype:"multipart/form-data"
          // 서버에서 response받아옴
          ,success: function(data){
            if(data.code == 200){
              alert("업로드 성공");
            } else{
              alert(data.error_message);
            }
          }
          ,error: function(e){
            alert("업로드실패");
          }
          
        });
      });

      $(".btn-comment").on("click",function(){

        let content = $(this).closest(".card").find(".comment-text").val().trim();
        // 누른 코멘트 댓글에서 가장 가까운 card의 th:data 의 postId를 셀렉트
        let postId = $(this).closest(".card").data('postid'); 
        if(!content){
          alert("내용을 입력하세요");
          return;
        }
       
        $.ajax({
          type:"get"
          ,url:"/comment/create"
          ,data : {"content" : content, "postId" : postId}
          // 서버에서 response받아옴
          ,success: function(data){
            if(data.code == 200){
              location.reload();
            } else{
              alert(data.error_message);
            }
          }
          ,error: function(e){
            alert("업로드실패");
          }
          
        });
      });






      $(".comment-delete-btn").on("click",function(){

        let commentId = $(this).closest(".comment").data(`commentid`);
        // 누른 코멘트 댓글에서 가장 가까운 card의 th:data 의 postId를 셀렉트 
        $.ajax({
          type:"post"
          ,url:"/comment/delete"
          ,data : {"commentId" : commentId}
          // 서버에서 response받아옴
          ,success: function(data){
            if(data.code == 200){
              location.reload();
            } else{
              alert(data.error_message);
            }
          }
          ,error: function(e){
            alert("댓글 삭제를 실패하였습니다");
          }
          
        });
      });

     
      $("#friend-search-btn").on("click",function(){

        let friendName = $("#search-friend").val().trim();
        // 누른 코멘트 댓글에서 가장 가까운 card의 th:data 의 postId를 셀렉트 
        $.ajax({
          type:"get"
          ,url:"/friend-request/add-friend-request"
          ,data : {"friendName" : friendName}
          // 서버에서 response받아옴
          ,success: function(data){
            if(data.result == "요청성공"){
              location.reload();
            } else{
              alert(data.result);
            }
          }
          ,error: function(e){
            alert("친구요청을 할 수 없습니다");
          }
          
        });
      });
    





         $(".like-btn").on("click",function(e){
            e.preventDefault();
          
          // 누른 코멘트 댓글에서 가장 가까운 card의 th:data 의 postId를 셀렉트
          let postId = $(this).closest(".card").data('postid'); 
          let countText = $(this).closest(".card").find(".like-count");
          let likeImage= $(this).closest(".card").find(".like-image"); 
          let count = parseInt(countText.text());
        
          $.ajax({
            type:"get"
            ,url:"/like/" + postId
            // 서버에서 response받아옴
            ,success: function(data){
              if(data.result == "삽입 성공"){
                likeImage.attr("src", '/image/filled_heart.png');
              
                countText.text(++count);

              } else if(data.result =="삭제 성공"){
                likeImage.attr("src", 'https://www.iconninja.com/files/214/518/441/heart-icon.png');
              
                countText.text(--count);
                
              }else{
                alert("토글 실패");
              }
            }
            ,error: function(e){
              alert("댓글 삭제를 실패하였습니다");
            }
            
            // 서버에서 response받아옴
        
            
          });
      });

      
      $(".friend-add-btn").on("click",function(){

        let friendId = $(this).data(`friend-id`);
        // 누른 코멘트 댓글에서 가장 가까운 card의 th:data 의 postId를 셀렉트 
        $.ajax({
          type:"get"
          ,url:"/friend/add"
          ,data : {"friendId" : friendId}
          // 서버에서 response받아옴
          ,success: function(data){
            if(data.result = "성공"){
              location.reload();
            } else{
              alert(data.result);
            }
          }
          ,error: function(e){
            alert("친구 추가를 실패하였습니다");
          }
          
        });
      });


        $(".friend-cancel-btn").on("click",function(){

          let friendId = $(this).data(`friend-id`);
          // 누른 코멘트 댓글에서 가장 가까운 card의 th:data 의 postId를 셀렉트 
          $.ajax({
            type:"delete"
            ,url:"/friend-request/delete-myfriend-request"
            ,data : {"friendId" : friendId}
            // 서버에서 response받아옴
            ,success: function(data){
              if(data.result = "요청 삭제"){
                location.reload();
              } else{
                alert(data.result);
              }
            }
            ,error: function(e){
              alert("친구 삭제를 실패하였습니다");
            }
            
          });
      });

       $(".friend-delete-btn").on("click",function(){

          let friendId = $(this).data(`friend-id`);
          // 누른 코멘트 댓글에서 가장 가까운 card의 th:data 의 postId를 셀렉트 
          $.ajax({
            type:"delete"
            ,url:"/friend/delete-friend"
            ,data : {"friendId" : friendId}
            // 서버에서 response받아옴
            ,success: function(data){
              if(data.result = "삭제 성공"){
                location.reload();
              } else{
                alert(data.result);
              }
            }
            ,error: function(e){
              alert("친구 삭제를 실패하였습니다");
            }
            
          });
      });

     
     

    });

  </script>


</th:block>
</html>
